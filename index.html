<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<title>Wcheckくん</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&text=%E3%81%8F%E3%82%93&display=swap" rel="stylesheet">
<style>
/* Wcheckくん（v0.1.0）：Vcheckくんと同じ作り。白を土台にティール #029AAA、イエロー #E5E647 は強調だけ。
   コンセプトは「70歳の方でも使える」：ボタンは大きく、手順は3つ、説明は最小限。 */
:root {
  --teal:#029AAA; --teal-ink:#027A87; --teal-deep:#01646F; --navy:#06304F; --yellow:#E5E647;
  --ink:#1B1F24; --sub:#5B6670; --line:#E3E7EA; --bg:#FFFFFF; --bg2:#F3F5F6; --tint:#E6F5F6; --ytint:#F8F8C8;
  --danger:#B42318; --pin:#E5484D;
  --grad-btn:linear-gradient(135deg, #03A3B4 0%, #029AAA 50%, #028F9E 100%);
  --grad-done:linear-gradient(135deg, #F2F36A 0%, #E5E647 55%, #D9DA35 100%);
  --headH:68px;
  color-scheme: light;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html { background:var(--bg); -webkit-text-size-adjust:100%; }
body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Meiryo",system-ui,sans-serif; font-size:16px; line-height:1.6; }
button, input, textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
button:disabled { cursor:not-allowed; opacity:.45; }
:focus-visible { outline:3px solid var(--teal-ink); outline-offset:2px; }
svg.i { width:24px; height:24px; flex:none; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }

/* ヘッダー：ロゴ・PC／スマホの切り替え・レビュー完了 */
.top { position:sticky; top:0; z-index:30; height:var(--headH); display:flex; align-items:center; gap:16px; padding:0 20px; padding-top:env(safe-area-inset-top, 0px);
  background:rgba(255,255,255,.97); backdrop-filter:saturate(1.4) blur(8px); border-bottom:1px solid var(--line); }
.logo { display:flex; align-items:baseline; gap:6px; text-decoration:none; color:var(--teal); flex:none; }
.logo b { font-family:"Nunito","Hiragino Sans",sans-serif; font-weight:900; font-size:30px; letter-spacing:-.02em; line-height:1; }
.logo b i { font-style:normal; position:relative; }
.logo b i::after { content:""; position:absolute; right:-3px; top:-3px; width:9px; height:9px; border-radius:50%; background:var(--yellow); box-shadow:0 0 0 2px #fff; }
.logo .kun { font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif; font-weight:800; font-size:21px; color:var(--teal); line-height:1; margin-left:-2px; }
.seg { display:inline-flex; background:var(--bg2); border-radius:999px; padding:4px; gap:4px; margin:0 auto; }
.seg button { display:inline-flex; align-items:center; gap:8px; min-height:48px; padding:0 22px; border:none; border-radius:999px; background:none; font-weight:800; font-size:17px; color:var(--sub); }
.seg button[aria-pressed="true"] { background:#fff; color:var(--teal-deep); box-shadow:0 1px 4px rgba(6,48,79,.18); }
.seg svg.i { width:22px; height:22px; }

/* ボタン */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:52px; min-width:52px; padding:8px 20px; border-radius:999px;
  border:1.5px solid var(--line); background:#fff; color:var(--ink); font-weight:800; font-size:16px; white-space:nowrap; }
.btn:hover { border-color:#C9D1D6; }
.btn.primary { background:var(--grad-btn); color:#fff; border-color:transparent; font-size:19px; box-shadow:0 2px 8px rgba(2,154,170,.28); }
.btn.primary:hover { filter:brightness(1.04); }
.btn.done { background:var(--grad-done); color:var(--navy); border:1.5px solid #B9BA1F; font-size:18px; box-shadow:0 3px 10px rgba(150,150,20,.35); }
.btn.done:hover { filter:brightness(1.03); }
.btn.line { border-color:var(--teal-ink); color:var(--teal-ink); }
.btn.quiet { color:var(--sub); font-weight:700; }
.btn.danger { border-color:#E7B4AE; color:var(--danger); }
.btn.on { background:var(--tint); border-color:var(--teal-ink); color:var(--teal-deep); }
.btn.sm { min-height:40px; padding:4px 14px; font-size:14px; }
.cnt { display:inline-grid; place-items:center; min-width:24px; height:24px; padding:0 7px; border-radius:999px; background:var(--navy); color:#fff; font-size:13px; font-weight:800; }
.btn.done.hdone { flex:none; }

/* 2列：左に画面写真、右にコメント */
.wrap { display:grid; grid-template-columns:minmax(0,1fr) 440px; gap:24px; max-width:1760px; margin:0 auto; padding:16px 24px 24px; align-items:start; }
.main { min-width:0; display:flex; flex-direction:column; gap:14px; }
.info h1 { font-size:22px; font-weight:800; margin:0; line-height:1.4; overflow-wrap:anywhere; }
.info .meta { color:var(--sub); font-size:14px; margin:2px 0 0; display:flex; flex-wrap:wrap; gap:2px 14px; }
.info .meta a { color:var(--teal-ink); }
/* 手順は3つ */
.flow { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; margin:0; padding:0; list-style:none; font-size:16px; font-weight:800; }
.flow li { display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:14px; padding:12px 14px; background:var(--bg2); line-height:1.4; }
.flow b { flex:none; display:grid; place-items:center; width:32px; height:32px; border-radius:50%; background:var(--teal-ink); color:#fff; font-size:17px; }

/* ページの切り替え（複数ページの時だけ） */
.ptabs { display:flex; gap:8px; flex-wrap:wrap; position:sticky; top:var(--headH); z-index:20; background:rgba(255,255,255,.97); padding:8px 0; }
.ptabs button { display:inline-flex; align-items:center; gap:8px; min-height:52px; padding:4px 18px 4px 6px; border-radius:999px; border:2px solid var(--line); background:#fff; font-weight:800; font-size:17px; color:var(--ink); }
.ptabs button .pno { display:grid; place-items:center; width:36px; height:36px; border-radius:50%; background:var(--bg2); color:var(--sub); font-size:15px; }
.ptabs button[aria-pressed="true"] { border-color:var(--teal-ink); background:var(--tint); color:var(--teal-deep); }
.ptabs button[aria-pressed="true"] .pno { background:var(--teal-ink); color:#fff; }
/* 画面写真 */
.stage { background:var(--bg2); border:1px solid var(--line); border-radius:14px; padding:18px; display:flex; justify-content:center; }
.stage.sp { padding:24px 18px; }
.shot { position:relative; width:100%; background:#fff; box-shadow:0 2px 14px rgba(6,48,79,.12); cursor:crosshair; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
.stage.sp .shot { width:390px; max-width:100%; border-radius:26px; overflow:hidden; border:10px solid #1B1F24; box-shadow:0 6px 24px rgba(6,48,79,.25); }
.shot img { display:block; width:100%; height:auto; pointer-events:none; }
.shot .loading { padding:80px 20px; text-align:center; color:var(--sub); }
#ink { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
#ink.on { pointer-events:auto; touch-action:none; cursor:crosshair; }
.pins { position:absolute; inset:0; pointer-events:none; }
.pin { position:absolute; transform:translate(-50%, -50%); width:40px; height:40px; border-radius:50%; border:3px solid #fff; background:var(--pin); color:#fff;
  font-weight:900; font-size:18px; display:grid; place-items:center; box-shadow:0 2px 8px rgba(0,0,0,.35); pointer-events:auto; padding:0; font-family:"Nunito","Hiragino Sans",sans-serif; }
.pin.sel { background:var(--navy); box-shadow:0 0 0 4px var(--yellow), 0 2px 8px rgba(0,0,0,.35); z-index:2; }
.pin.new { background:var(--yellow); color:var(--navy); border-color:var(--navy); animation:pop .9s ease-in-out infinite alternate; z-index:3; }
@keyframes pop { to { transform:translate(-50%, -50%) scale(1.12); } }
#inkText { position:absolute; z-index:4; font-size:16px; padding:8px 10px; background:rgba(6,48,79,.92); color:#fff; border:2px solid var(--yellow); border-radius:8px; width:min(260px, 70%); outline:none; }

/* 右：書く欄・一覧・全体へのコメント・届け方 */
.aside { min-width:0; position:sticky; top:calc(var(--headH) + 16px); max-height:calc(100vh - var(--headH) - 32px); overflow:auto; display:flex; flex-direction:column; gap:14px; padding:0 4px 8px 0; }
.card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; min-width:0; }
.card h2 { font-size:18px; margin:0 0 10px; font-weight:800; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.composer .idle { display:flex; align-items:center; gap:14px; font-size:17px; font-weight:800; color:var(--teal-deep); background:var(--tint); border-radius:12px; padding:16px; margin:0; line-height:1.5; }
.composer .idle svg.i { width:34px; height:34px; color:var(--teal); }
.pinbadge { display:inline-grid; place-items:center; width:34px; height:34px; border-radius:50%; background:var(--yellow); color:var(--navy); border:2px solid var(--navy); font-weight:900; font-size:16px; font-family:"Nunito","Hiragino Sans",sans-serif; }
.where { font-size:13px; color:var(--sub); font-weight:600; }
#box { width:100%; min-height:96px; max-height:220px; resize:none; font-size:18px; line-height:1.55; padding:12px 14px; border:2px solid var(--line); border-radius:14px; background:#fff; outline:none; display:block; }
#box:focus { border-color:var(--teal-ink); box-shadow:0 0 0 3px rgba(2,154,170,.14); }
.tools { display:grid; grid-template-columns:repeat(auto-fit, minmax(110px, 1fr)); gap:8px; margin-top:10px; }
.tools .btn { min-height:52px; padding:6px 10px; font-size:16px; }
#mic.on { background:#C0262D; border-color:#C0262D; color:#fff; animation:pulse 1s infinite; }
@keyframes pulse { 50% { opacity:.72; } }
.draw { border:1px solid var(--line); border-radius:12px; padding:10px; margin-top:10px; background:var(--bg2); }
.draw .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.draw .row + .row { margin-top:8px; }
.draw .btn { min-height:46px; padding:4px 12px; font-size:15px; gap:4px; }
.draw .btn svg.i { width:20px; height:20px; }
.draw .btn[data-tool].on { background:var(--yellow); border-color:var(--navy); color:var(--navy); }
.draw .dot { width:46px; height:46px; border-radius:50%; padding:0; border:3px solid #fff; box-shadow:0 0 0 1.5px #B9C3C9; background:var(--c); }
.draw .dot.on { box-shadow:0 0 0 3.5px var(--navy); }
.draw .note { margin:8px 0 0; font-size:13px; color:var(--sub); }
.actrow { display:flex; gap:10px; margin-top:12px; }
.actrow .btn { flex:1; }
.actrow #add { flex:2; }
.hint { font-size:13px; color:var(--sub); margin:8px 0 0; }
.thumbs { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.thumbs:empty { display:none; }
.thumbs img { height:48px; border-radius:6px; border:1px solid var(--line); cursor:pointer; }

/* 画像・色・参考URL（個別のコメントと全体へのコメントの両方） */
.extras:empty { display:none; }
.urlrow { display:flex; flex-direction:column; gap:4px; margin-top:10px; font-size:14px; font-weight:800; color:var(--ink); }
.urlrow input { font-size:17px; padding:10px 12px; border:2px solid var(--line); border-radius:12px; min-height:52px; width:100%; }
.urlrow input:focus { border-color:var(--teal-ink); outline:none; }
.cpanel { border:1px solid var(--line); border-radius:12px; padding:10px; margin-top:10px; background:var(--bg2); display:flex; flex-direction:column; gap:8px; }
.cpanel .crow2 { display:flex; gap:8px; align-items:center; }
.cpanel input[type=color] { width:64px; height:52px; padding:2px; border:2px solid var(--line); border-radius:12px; background:#fff; flex:none; cursor:pointer; }
.cpanel .crow2 .btn { flex:1; }
.cpanel .note { margin:0; font-size:13px; color:var(--sub); }
.xchips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.xchips:empty { display:none; }
.xchip { display:inline-flex; align-items:center; gap:6px; min-height:40px; padding:2px 6px 2px 4px; border-radius:999px; border:1.5px solid var(--line); background:#fff; font-size:14px; font-weight:800; font-variant-numeric:tabular-nums; }
.xchip i { width:28px; height:28px; border-radius:50%; border:1px solid rgba(0,0,0,.2); display:inline-block; }
.xchip button { border:none; background:none; width:30px; height:30px; border-radius:50%; color:var(--sub); font-size:16px; padding:0; }
.xchip button:hover { background:var(--bg2); }
.tools .btn.on { background:var(--tint); border-color:var(--teal-ink); color:var(--teal-deep); }
body.picking .shot { cursor:copy; outline:4px dashed var(--yellow); outline-offset:-4px; }
.sw { display:inline-block; width:14px; height:14px; border-radius:50%; border:1px solid rgba(0,0,0,.25); vertical-align:-2px; margin-right:4px; }
.badge a { color:var(--teal-ink); }
.listhead { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
.listhead h2 { margin:0; }
.listhead span { color:var(--sub); font-size:14px; font-weight:700; }
#list { list-style:none; margin:8px 0 0; padding:0; display:flex; flex-direction:column; }
#list li { display:grid; grid-template-columns:auto minmax(0,1fr); column-gap:12px; row-gap:6px; padding:12px 0; border-bottom:1px solid var(--line); }
#list li:last-child { border-bottom:none; }
#list li.sel { background:var(--ytint); border-radius:10px; padding-left:8px; padding-right:8px; }
#list .num { grid-row:1 / span 3; width:38px; height:38px; border-radius:50%; background:var(--pin); color:#fff; border:none; font-weight:900; font-size:17px; display:grid; place-items:center; padding:0; font-family:"Nunito","Hiragino Sans",sans-serif; }
#list .ctext { white-space:pre-wrap; overflow-wrap:anywhere; font-weight:700; font-size:16px; line-height:1.5; padding-top:6px; }
.badges { display:flex; flex-wrap:wrap; gap:6px; font-size:12px; }
.badge { border-radius:4px; padding:1px 7px; background:var(--bg2); color:var(--sub); font-weight:700; }
.badge.ok { background:var(--tint); color:var(--teal-deep); }
.badge.wait { background:var(--ytint); color:var(--navy); }
.acts { display:flex; gap:8px; }
.acts .btn { min-height:38px; padding:2px 14px; font-size:14px; }
#list li .edit textarea { width:100%; min-height:80px; font-size:17px; padding:8px 10px; border:2px solid var(--teal-ink); border-radius:10px; resize:vertical; }
.empty { color:var(--sub); font-size:15px; margin:8px 0 0; }
.overall textarea { width:100%; min-height:110px; resize:vertical; font-size:17px; line-height:1.55; padding:10px 12px; border:2px solid var(--line); border-radius:12px; background:#fff; }
.overall .sub { font-size:14px; color:var(--sub); font-weight:600; }
.overall .crow { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
.field { display:flex; flex-direction:column; gap:4px; font-size:14px; color:var(--sub); }
.field b { color:var(--ink); font-weight:800; font-size:16px; }
.field input { font-size:17px; padding:10px 12px; border:2px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); min-height:52px; }
.sendrow { display:flex; flex-direction:column; gap:10px; }
.sendrow .btn { width:100%; }
.sendrow .sub2 { display:flex; gap:8px; }
.sendrow .sub2 .btn { flex:1; }
.state { font-size:14px; font-weight:700; border-radius:10px; padding:8px 12px; margin:10px 0 0; background:var(--bg2); }
.state.unsent { background:var(--ytint); color:var(--navy); }
.state.done { background:var(--tint); color:var(--teal-deep); }
.result { font-size:15px; font-weight:700; border-radius:10px; padding:8px 12px; margin:10px 0 0; }
.result.ok { background:var(--tint); color:var(--teal-deep); }
.result.ng { background:#FDECEA; color:var(--danger); }
#copyBox { width:100%; min-height:120px; font-size:15px; padding:10px; border:2px solid var(--line); border-radius:10px; margin-top:8px; }
.fb > summary { cursor:pointer; color:var(--sub); font-size:14px; font-weight:700; min-height:40px; display:flex; align-items:center; list-style:none; }
.fb > summary::-webkit-details-marker { display:none; }
.fb textarea { width:100%; min-height:70px; font-size:16px; padding:8px 10px; border:1.5px solid var(--line); border-radius:10px; }
.fb .row { display:flex; justify-content:flex-end; margin-top:6px; }
.sheethead { display:none; }
.mbar { display:none; }
.toast { position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); max-width:calc(100% - 32px); background:var(--navy); color:#fff;
  padding:12px 18px; border-radius:12px; font-weight:800; font-size:16px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:80; box-shadow:0 6px 20px rgba(6,48,79,.3); }
.toast.show { opacity:1; }
.ver { text-align:right; color:var(--sub); font-size:11px; padding:0 16px 16px; }

/* 1000px 以下（スマホ・タブレット）：写真を幅いっぱいに。書く欄と一覧は下から出る */
@media (max-width: 1000px) {
  :root { --headH:60px; }
  .top { padding:0 10px; gap:8px; }
  .logo b { font-size:24px; } .logo .kun { font-size:17px; }
  .seg { margin-left:auto; margin-right:0; }
  .seg button { min-height:44px; padding:0 14px; font-size:16px; gap:6px; }
  .seg svg.i { display:none; }
  .top .hdone { display:none; }
  .wrap { display:block; padding:10px 0 calc(96px + env(safe-area-inset-bottom, 0px)); }
  .main { gap:10px; }
  .info, .flow { margin:0 12px; }
  .ptabs { flex-wrap:nowrap; overflow-x:auto; padding:8px 12px; scrollbar-width:none; border-bottom:1px solid var(--line); }
  .ptabs::-webkit-scrollbar { display:none; }
  .ptabs button { flex:none; min-height:48px; font-size:16px; }
  .info h1 { font-size:18px; }
  .flow { grid-template-columns:1fr; gap:6px; }
  .flow li { padding:8px 12px; font-size:15px; }
  .flow b { width:28px; height:28px; font-size:15px; }
  .stage, .stage.sp { border-radius:0; border-left:none; border-right:none; padding:0; background:#fff; }
  .stage.sp .shot { width:100%; border:none; border-radius:0; box-shadow:none; }
  .shot { box-shadow:none; }
  .aside { position:static; max-height:none; overflow:visible; padding:0; display:block; }
  /* 下から出る欄（書く欄・一覧） */
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:50; max-height:82vh; overflow:auto; border-radius:20px 20px 0 0; border:none;
    box-shadow:0 -8px 30px rgba(6,48,79,.25); padding:14px 14px calc(14px + env(safe-area-inset-bottom, 0px)); background:#fff; }
  .composer.sheet { display:none; }
  body.composing .composer.sheet { display:block; }
  body.composing.drawing #box, body.composing.drawing #mic, body.composing.drawing #cAtt, body.composing.drawing #cColor, body.composing.drawing #cUrlBtn, body.composing.drawing #cExtras { display:none !important; }   /* 描く間は写真を広く。「描き終わる」は残す */
  #panel { display:none; }
  body.listopen #panel { display:flex; flex-direction:column; gap:12px; background:var(--bg2); }
  .sheethead { display:flex; align-items:center; justify-content:space-between; gap:8px; position:sticky; top:-14px; z-index:2; background:var(--bg2); margin:-14px -14px 0; padding:12px 14px; border-radius:20px 20px 0 0; }
  .toast { bottom:calc(92px + env(safe-area-inset-bottom, 0px)); }
  .sheethead h2 { margin:0; font-size:19px; }
  .scrim { position:fixed; inset:0; background:rgba(6,48,79,.35); z-index:45; }
  .mbar { display:flex; position:fixed; left:0; right:0; bottom:0; z-index:40; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); background:rgba(255,255,255,.97); border-top:1px solid var(--line); box-shadow:0 -4px 16px rgba(6,48,79,.08); }
  .mbar .btn { flex:1; min-height:56px; font-size:17px; padding:6px 10px; }
  body.composing .mbar, body.listopen .mbar { display:none; }
  .composer .idle { display:none; }
  .composer h2 { margin-bottom:8px; }
  #box { min-height:80px; font-size:17px; }
}
@media (min-width: 1001px) { .scrim { display:none !important; } #panel { display:flex; flex-direction:column; gap:14px; } }
@media (max-width: 380px) { .seg button { padding:0 10px; font-size:15px; } .logo .kun { display:none; } }
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="#" id="logo" aria-label="Wcheckくん"><b>W<i></i>check</b><span class="kun">くん</span></a>
  <div class="seg" role="group" aria-label="見る画面">

<script>
// Wcheckくん（版は VER）。確認してもらうページの縦長の画面写真（PC・スマホ）に、押した所のピンと一言・描き込みを残す。
// 使い方：index.html?p=<pages の下の名前>（複数ページはカンマで：?p=top,about,price）&to=<受け取り口の URL>。画面写真は 道具/shot.py で作る（pages/<名前>/pc.jpg・sp.jpg・page.js）。
// コメントは見た人のブラウザに残り、「レビュー完了」を押した時だけ受け取り口（Vcheckくんと同じ Google Apps Script）に届く。
const VER = "0.2.0";
const Q = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
// 確認するページ（いくつでも）。何も無い時は動作見本（クリファのトップとポートフォリオ）
const PIDS = [...new Set((Q.get("p") || "crifa-top,crifa-portfolio").split(",").map(x => x.trim().replace(/[^A-Za-z0-9_-]/g, "")).filter(Boolean))];
let PID = PIDS[0];
const KEY = "hpcheck:" + PIDS.join(",");
const TOUCH = matchMedia("(pointer: coarse)").matches;
const NARROW = () => innerWidth <= 1000;
const RECEIVER = Q.get("to") || "";       // 受け取り口（このページを置いた人の Google）。無い時は「コメントを全てコピー」で返してもらう
const FEEDBACK_ID = "wcheck-request";
const PAGES = {};
let PAGE = null, dev = (TOUCH || NARROW()) ? "sp" : "pc";
const OV0 = () => ({ text: "", images: [], url: "", colors: [], sentSig: "" });
let items = [], overall = OV0(), saveOK = true;
try { items = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { items = []; }
items.forEach(it => { if (!it.pg) it.pg = PIDS[0]; });
try { overall = Object.assign(overall, JSON.parse(localStorage.getItem(KEY + ":overall") || "{}")); } catch (e) {}
const nameEl = $("name");
try { nameEl.value = localStorage.getItem("hpcheck:name") || ""; } catch (e) {}
nameEl.addEventListener("change", () => { try { localStorage.setItem("hpcheck:name", nameEl.value.trim()); } catch (e) {} });
function save() { try { localStorage.setItem(KEY, JSON.stringify(items)); saveOK = true; } catch (e) { saveOK = false; } }
function saveOverall() { try { localStorage.setItem(KEY + ":overall", JSON.stringify(overall)); } catch (e) { toast("画像が多くて保存しきれません。レビュー完了を押してください", 3000); } }
let toastTimer = 0;
function toast(m, ms) { const e = $("toast"); e.textContent = m; e.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => e.classList.remove("show"), ms || 2000); }
const DEVNAME = { pc: "パソコン", sp: "スマホ" };
const CIRC = "①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳";
const numStr = n => CIRC[n - 1] || "(" + n + ")";
function shotOf(d, pg) { const P = pg ? PAGES[pg] : PAGE; return P && P.shots[d || dev]; }
const labelOf = pg => (PAGES[pg] && (PAGES[pg].label || PAGES[pg].title)) || pg;
const MULTI = PIDS.length > 1;
function whereText(it) {          // 「上から 1234px（14%）・左から 40%」（ページの左上から。写真を撮った幅での px）
  const s = shotOf(it.dev, it.pg); if (!s) return "";
  return "上から " + Math.round(it.y) + "px（" + Math.round(it.y / s.h * 100) + "%）・左から " + Math.round(it.x / s.w * 100) + "%";
}

// ---- ページ（画面写真）を読む：pages/<名前>/page.js（file:// で開いても読めるように script で読む）
(function loadPages() {
  let left = PIDS.length;
  PIDS.forEach(pg => {
    const s = document.createElement("script"); s.src = "pages/" + pg + "/page.js?" + Date.now();
    s.onload = s.onerror = () => { const P = (window.HP_PAGES || {})[pg]; if (P) PAGES[pg] = P; if (--left === 0) start(); };
    document.head.append(s);
  });
})();
function start() {
  const ok = PIDS.filter(pg => PAGES[pg]);
  if (!ok.length) { $("loading").textContent = "確認するページが見つかりません。送られてきたリンクをもう一度開いてください。"; $("ttl").textContent = "ページが見つかりません"; return; }
  PIDS.splice(0, PIDS.length, ...ok);
  const tabs = $("pageTabs"); tabs.innerHTML = ""; tabs.hidden = !MULTI;
  PIDS.forEach((pg, i) => {
    const b = document.createElement("button"); b.dataset.pg = pg; b.onclick = () => { if (pg !== PID) { setPage(pg); scrollTo({ top: 0 }); } };
    b.innerHTML = '<span class="pno">' + (i + 1) + '</span>'; b.append(labelOf(pg)); const c = document.createElement("span"); c.className = "cnt"; c.hidden = true; b.append(c);
    tabs.append(b);
  });
  setPage(PIDS.includes(PID) ? PID : PIDS[0]);
}
function setPage(pg) {
  if (pending) cancelPin();
  PID = pg; PAGE = PAGES[pg]; selN = 0;
  $("ttl").textContent = PAGE.title; document.title = PAGE.title + "｜Wcheckくん";
  const m = $("meta"); m.innerHTML = "";
  const a = document.createElement("a"); a.href = PAGE.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = PAGE.url; m.append(a);
  const sp = document.createElement("span"); sp.textContent = PAGE.made + " の画面"; m.append(sp);
  document.querySelectorAll("#pageTabs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.pg === pg)));
  setDev(dev); render();
}
function tabCounts() { document.querySelectorAll("#pageTabs button").forEach(b => { const n = items.filter(it => it.pg === b.dataset.pg).length, c = b.querySelector(".cnt"); c.hidden = !n; c.textContent = n + "件"; }); }
function setDev(d) {
  dev = d;
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.dev === d)));
  $("stage").className = "stage " + d;
  if (!PAGE) return;
  if (pending && pending.dev !== d) cancelPin();
  if (picking) stopPicking();
  const s = shotOf(), img = $("img");
  img.hidden = true; $("loading").hidden = false; $("loading").textContent = "画面を読み込んでいます…";
  img.onload = () => { img.hidden = false; $("loading").hidden = true; drawAll(); };
  img.onerror = () => { $("loading").textContent = "画面の写真を読み込めませんでした。電波を確かめて、ページを読み込み直してください。"; };
  img.src = "pages/" + PID + "/" + s.img;
  $("ink").setAttribute("viewBox", "0 0 " + s.w + " " + s.h);
  drawAll();
}
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => { if (b.dataset.dev !== dev) { setDev(b.dataset.dev); scrollTo({ top: 0 }); } });

// ---- ピン（押した所）と書く欄
let pending = null, selN = 0, shapes = [];
const D0 = () => ({ url: "", colors: [], images: [] });
let draft = D0();          // 書いている途中のコメントの「画像・色・参考URL」
const shot = $("shot"), box = $("box"), ink = $("ink");
function toPage(e) {               // 押した所 → ページの座標（写真を撮った幅の px）
  const r = shot.getBoundingClientRect(), s = shotOf();
  return [Math.max(0, Math.min(s.w, (e.clientX - r.left) / r.width * s.w)), Math.max(0, Math.min(s.h, (e.clientY - r.top) / r.height * s.h))];
}
shot.addEventListener("click", e => {
  if (!PAGE || $("img").hidden || drawOn || e.target.closest(".pin") || e.target === $("inkText")) return;
  if (picking) { pickColor(e); return; }
  const [x, y] = toPage(e);
  if (pending) { pending.x = x; pending.y = y; }        // 書いている途中なら、ピンだけ動かす
  else { pending = { dev, x, y }; shapes = []; draft = D0(); showX("c"); }
  selN = 0; openComposer(); drawAll();
});
function openComposer() {
  $("idle").hidden = true; $("write").hidden = false;
  document.body.classList.add("composing"); closeList();
  $("pinNo").textContent = items.length + 1; $("where").textContent = DEVNAME[pending.dev];
  $("keyHint").hidden = TOUCH;
  refresh();
  if (!TOUCH) box.focus({ preventScroll: true });
  if (NARROW()) setTimeout(() => keepPinVisible(), 60);
}
function keepPinVisible() {        // スマホ：下から出た欄にピンが隠れないように
  if (!pending) return;
  const r = shot.getBoundingClientRect(), s = shotOf(), py = r.top + pending.y / s.h * r.height;
  const sheetTop = innerHeight - $("composer").offsetHeight, head = document.querySelector(".top").offsetHeight;
  if (py > sheetTop - 50 || py < head + 20) scrollTo({ top: scrollY + py - head - Math.max(80, (sheetTop - head) * 0.35), behavior: "smooth" });
}
function hasDraft() { return !!(box.value.trim() || shapes.length || draft.images.length || draft.url.trim() || draft.colors.length); }
function refresh() { $("add").disabled = !pending || !hasDraft(); }
function cancelPin() {
  if (listening && rec) { micWant = false; try { rec.abort(); } catch (e) {} }
  pending = null; shapes = []; draft = D0(); box.value = ""; showX("c"); openX("c", null); stopPicking(); showDraw(false); closeText(false);
  $("idle").hidden = false; $("write").hidden = true; document.body.classList.remove("composing", "drawing"); box.blur(); drawAll();
}
function commit() {
  if (!pending) return;
  const text = box.value.trim() || (shapes.length ? "（描き込み）" : "") || (draft.images.length ? "（画像）" : "") || ((draft.url.trim() || draft.colors.length) ? "（参考・色）" : "");
  if (!text) { box.focus(); return; }
  const it = { pg: PID, dev: pending.dev, x: Math.round(pending.x), y: Math.round(pending.y), text, at: Date.now() };
  if (shapes.length) it.d = shapes.map(roundShape);
  if (draft.images.length) it.images = draft.images.slice();
  if (draft.url.trim()) it.url = draft.url.trim();
  if (draft.colors.length) it.colors = draft.colors.slice();
  items.push(it); save(); const n = items.length;
  cancelPin(); render();
  toast(saveOK ? numStr(n) + " を追加しました" : "追加しましたが、このブラウザに保存できませんでした", 2200);
}
$("add").onclick = commit;
$("cancel").onclick = cancelPin;
box.addEventListener("input", refresh);
box.addEventListener("keydown", e => {
  if (e.isComposing || e.keyCode === 229) return;
  if (e.key === "Escape") { cancelPin(); return; }
  if (e.key === "Enter" && !e.shiftKey && !TOUCH) { e.preventDefault(); commit(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && pending && document.activeElement !== box && document.activeElement !== $("inkText")) cancelPin(); });

// ---- 描く（ペン・矢印・四角・丸・文字／黄・赤・白）。位置はページの px で持つ（SVG なので長い写真でも重くならない）
const COLORS = { y: "#f2d33a", r: "#ff3b3b", w: "#ffffff" }, CNAME = { y: "黄", r: "赤", w: "白" };
const KIND = { p: "線", a: "矢印", r: "四角", o: "丸", t: "文字" };
let tool = "a", color = "r", drawOn = false, live = null, textAt = null;   // ホームページは白地が多いので、はじめの色は赤
function showDraw(on) {
  drawOn = on; $("draw").hidden = !on; $("drawOpen").classList.toggle("on", on); $("drawOpen").setAttribute("aria-pressed", String(on));
  $("drawOpen").querySelector("span").textContent = on ? "描き終わる" : "描く";
  ink.classList.toggle("on", on); document.body.classList.toggle("drawing", on);
  if (!on) closeText(true);
}
$("drawOpen").onclick = () => { showDraw(!drawOn); if (drawOn && TOUCH) box.blur(); if (NARROW()) setTimeout(keepPinVisible, 80); };
function markBar() {
  document.querySelectorAll("[data-tool]").forEach(b => b.classList.toggle("on", b.dataset.tool === tool));
  document.querySelectorAll("[data-color]").forEach(b => b.classList.toggle("on", b.dataset.color === color));

  let sent = 0, ovDone = !ovNew;
  try {
    for (const [pg, g] of groups) {
      const withOv = !ovDone;
      const body = { video: "hp-" + pg, title: (PAGES[pg] || {}).title || pg, name: nameEl.value.trim(),
        overall: withOv ? { text: [(MULTI ? "（サイト全体）" : "") + (overall.text || "").trim()].concat(xText(overall, "")).filter(Boolean).join("\n"), images: overall.images } : null,
        items: g.map(([it, i]) => payloadItem(it, i)) };
      const r = await fetch(RECEIVER, { method: "POST", body: JSON.stringify(body) }), j = await r.json();
      if (!j.ok) throw new Error("ng");
      g.forEach(([it]) => it.sent = true); save(); sent += g.length;
      if (withOv) { overall.sentSig = ovSig(); saveOverall(); ovDone = true; sent++; }
    }
    render(); showResult(true, "レビュー完了。" + sent + " 件が作り手に届きました。ありがとうございました。");
  } catch (e) { render(); showResult(false, "送れませんでした。電波を確かめて、もう一度「レビュー完了」を押してください（コメントは残っています）。"); }
  sendBtn.disabled = false; sendBtn.querySelector(".lbl").textContent = "レビュー完了";
};
function asText() {
  const who = nameEl.value.trim(), ovt = (overall.text || "").trim();
  const first = PAGES[PIDS[0]] || {};
  const name = MULTI ? (first.title || PIDS[0]) + " ほか " + (PIDS.length - 1) + " ページ" : (PAGE ? PAGE.title : PID);
  const head = ["【" + name + "】確認コメント " + items.length + "件" + (who ? "（" + who + "）" : "")].concat(MULTI ? [] : [PAGE ? PAGE.url + "（" + PAGE.made + " の画面）" : ""]).filter(Boolean);
  const im = n => n ? "（画像 " + n + " 枚" + (RECEIVER ? "）" : "。画像はメッセージに一緒に貼ってください）") : "";
  const top = ovHas() ? ["【全体】"].concat(ovt || overall.images.length ? [ovt + im(overall.images.length)] : [], xText(overall, ""), ["ーーーーー"]) : [];
  const one = (it, i) => [numStr(i + 1) + " " + DEVNAME[it.dev] + "・" + whereText(it), "　" + it.text.replace(/\n/g, "\n　") + im((it.images || []).length)]
    .concat(xText(it, "　"), it.d ? ["　✎ " + inkDesc(it.d)] : []).join("\n");
  let lines = [];
  if (!MULTI) lines = items.map(one);
  else PIDS.forEach(pg => {
    const g = items.map((it, i) => [it, i]).filter(([it]) => it.pg === pg); if (!g.length) return;
    const P = PAGES[pg] || {};
    lines.push("■ " + labelOf(pg) + "　" + (P.url || "") + "（" + (P.made || "") + " の画面）");
    g.forEach(([it, i]) => lines.push(one(it, i)));
  });
  return head.concat(top, lines).join("\n");
}
async function copyText(txt) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(txt); return true; } } catch (e) {}
  try {
    const ta = document.createElement("textarea"); ta.value = txt; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
    document.body.append(ta); ta.select(); ta.setSelectionRange(0, txt.length); const ok = document.execCommand("copy"); ta.remove(); return !!ok;
  } catch (e) { return false; }
}
copyBtn.onclick = async () => {
  if (!items.length && !ovHas()) { openList(); showResult(false, "まだコピーするコメントがありません"); return; }
  const txt = asText(), cb = $("copyBox");
  if (await copyText(txt)) { cb.hidden = true; showResult(true, "コピーしました。メッセージに貼り付けて送ってください"); }
  else { openList(); cb.value = txt; cb.hidden = false; showResult(false, "コピーできませんでした。下の枠の文を長押しで全部選んで、コピーしてください"); cb.focus(); cb.select(); }
};
$("share").onclick = async () => toast(await copyText(location.href) ? "このページのリンクをコピーしました" : "コピーできませんでした。アドレス欄からコピーしてください", 2600);
let armed = false;
$("clear").onclick = e => {           // 2回押しで消す（ブラウザの確認画面は使わない）
  const b = e.currentTarget;
  if (!armed) { armed = true; b.textContent = "もう一度押すと消えます"; setTimeout(() => { armed = false; b.textContent = "全部消す"; }, 3000); return; }
  items = []; save(); overall = OV0(); ov.value = ""; saveOverall(); showX("ov");
  armed = false; b.textContent = "全部消す"; selN = 0; render(); toast("コメントを全部消しました");
};

// ---- 一覧（番号を押すとその場所へ。「編集」「削除」）
function selectItem(n, fromList) {
  const it = items[n - 1]; if (!it) return;
  if (it.pg !== PID) setPage(it.pg);
  selN = n;
  if (it.dev !== dev) setDev(it.dev);
  render();
  const go = () => {
    const s = shotOf(), r = shot.getBoundingClientRect(), head = document.querySelector(".top").offsetHeight + ($("pageTabs").hidden ? 0 : $("pageTabs").offsetHeight);
    scrollTo({ top: Math.max(0, scrollY + r.top + it.y / s.h * r.height - head - (innerHeight - head) * 0.35), behavior: "smooth" });
  };
  if (fromList) { closeList(); setTimeout(go, 60); }
  else {
    if (NARROW()) openList();
    const li = list.querySelector('[data-n="' + n + '"]'); if (li) li.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
}
const list = $("list");
function render() {
  list.innerHTML = "";
  $("count").textContent = items.length ? items.length + " 件" : "";
  $("empty").hidden = !!items.length;
  items.forEach((it, i) => {
    const n = i + 1, li = document.createElement("li"); li.dataset.n = n; if (selN === n) li.className = "sel";
    const nb = document.createElement("button"); nb.className = "num"; nb.textContent = n; nb.title = "この場所を見る"; nb.setAttribute("aria-label", numStr(n) + " の場所を見る");
    nb.onclick = () => selectItem(n, true);
    const c = document.createElement("div"); c.className = "ctext"; c.textContent = it.text;
    const bd = document.createElement("div"); bd.className = "badges";
    const badge = (t, cls) => { const s = document.createElement("span"); s.className = "badge" + (cls ? " " + cls : ""); s.textContent = t; bd.append(s); };
    if (MULTI) badge(labelOf(it.pg));
    badge(DEVNAME[it.dev]);
    if (it.d) badge("描き込み");
    if (it.images && it.images.length) badge("画像 " + it.images.length);
    (it.colors || []).forEach(c => { const s = document.createElement("span"); s.className = "badge"; s.innerHTML = '<span class="sw" style="background:' + c.hex + '"></span>'; s.append(CK[c.k] + " " + c.hex); bd.append(s); });
    if (it.url) { const s = document.createElement("span"); s.className = "badge"; const a = document.createElement("a"); a.href = it.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = "参考のサイト"; s.append(a); bd.append(s); }
    if (RECEIVER) badge(it.sent ? "✓ 届いた" : "まだ", it.sent ? "ok" : "wait");
    const acts = document.createElement("div"); acts.className = "acts";
    const ed = document.createElement("button"); ed.className = "btn quiet"; ed.textContent = "編集";
    const del = document.createElement("button"); del.className = "btn danger"; del.textContent = "削除";
    del.onclick = () => { items.splice(i, 1); save(); selN = 0; render(); toast("削除しました"); };
    ed.onclick = () => {
      const w = document.createElement("div"); w.className = "edit";
      const ta = document.createElement("textarea"); ta.value = it.text; ta.setAttribute("aria-label", "コメントを編集");
      const row = document.createElement("div"); row.className = "acts"; row.style.marginTop = "6px";
      const ok = document.createElement("button"); ok.className = "btn line"; ok.textContent = "保存";
      const no = document.createElement("button"); no.className = "btn quiet"; no.textContent = "やめる";
      row.append(no, ok); w.append(ta, row); c.hidden = true; acts.hidden = true; li.append(w); ta.focus();
      no.onclick = () => render();
      ok.onclick = () => { const nt = ta.value.trim(); if (!nt) { toast("空にはできません。消す時は「削除」"); return; }
        if (nt !== it.text) { it.text = nt; it.sent = false; save(); toast("直しました"); } render(); };
    };
    acts.append(ed, del);
    li.append(nb, c, bd, acts); list.append(li);
  });
  drawAll(); updState(); tabCounts();
}

// ---- スマホ：一覧は下から出す
function openList() { if (!NARROW()) return; if (pending) cancelPin(); document.body.classList.add("listopen"); $("scrim").hidden = false; }
function closeList() { document.body.classList.remove("listopen"); $("scrim").hidden = true; }
$("openList").onclick = openList;
$("panelClose").onclick = closeList;
$("scrim").onclick = () => { if (document.body.classList.contains("listopen")) closeList(); };
$("logo").onclick = e => { e.preventDefault(); scrollTo({ top: 0, behavior: "smooth" }); };

// ---- Wcheckくんへの要望（同じ受け取り口に「wcheck-request」で届く）
$("fbSend").onclick = async () => {
  const t = $("fbText").value.trim(), b = $("fbSend"), r = $("fbResult");
  if (!t) { toast("要望を書いてください"); $("fbText").focus(); return; }
  b.disabled = true; b.textContent = "送っています…";
  const body = { video: FEEDBACK_ID, title: "Wcheckくんへの要望", name: nameEl.value.trim(),
    overall: { text: t + "\n（見ていたページ：" + (PAGE ? PAGE.title : PID) + "／" + DEVNAME[dev] + "の画面／" + (TOUCH ? "スマホ・タブレット" : "パソコン") + "／v" + VER + "）", images: [] }, items: [] };
  try { const res = await fetch(RECEIVER, { method: "POST", body: JSON.stringify(body) }), j = await res.json(); if (!j.ok) throw 0;
    $("fbText").value = ""; r.hidden = false; r.className = "result ok"; r.textContent = "送りました。ありがとうございます"; }
  catch (e) { r.hidden = false; r.className = "result ng"; r.textContent = "送れませんでした。もう一度押してください"; }
  b.disabled = false; b.textContent = "送る";
};
render();
</script>
